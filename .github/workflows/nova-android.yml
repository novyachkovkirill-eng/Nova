name: Build NOVA Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Full Telegram build with NDK/FFmpeg/TDLib takes a long time on hosted runners.
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Fetch submodules (shallow)
        run: git submodule update --init --recursive --depth=1

      - name: Apply NOVA changes
        run: python3 nova_apply.py

      - name: Inject Telegram API credentials from secrets
        env:
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          app_id = os.environ.get("TG_APP_ID", "").strip()
          app_hash = os.environ.get("TG_APP_HASH", "").strip()
          if not app_id.isdigit() or not re.fullmatch(r"[0-9a-f]{32}", app_hash):
              sys.exit("::error::Secrets TG_APP_ID (digits) and TG_APP_HASH (32 hex chars) must be set in repository secrets")
          p = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          src = p.read_text(encoding="utf-8")
          src, n1 = re.subn(r"(public static int APP_ID = )\d+;", lambda m: m.group(1) + app_id + ";", src)
          src, n2 = re.subn(r'(public static String APP_HASH = )"[^"]*";', lambda m: m.group(1) + '"' + app_hash + '";', src)
          if n1 != 1 or n2 != 1:
              sys.exit(f"::error::Could not patch BuildVars (APP_ID matches={n1}, APP_HASH matches={n2})")
          p.write_text(src, encoding="utf-8")
          print("Telegram API credentials injected (values are masked in logs).")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: |
          set +e
          yes | sdkmanager --licenses
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Configure Gradle
        run: |
          sed -i 's/-Xmx8g/-Xmx5g/' gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon --max-workers=2 --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-APK
          path: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 7
